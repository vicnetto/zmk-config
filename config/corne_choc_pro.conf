# Global
## Upgrade BLE power for better connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
## Keyboard name shown to USB and Bluetooth hosts (max. 16 characters)
CONFIG_ZMK_KEYBOARD_NAME="Corne Choc BT"
## Move mouse using the keyboard
CONFIG_ZMK_POINTING=y
## The keymap is defined in corne_choc_pro.keymap, not edited at runtime
CONFIG_ZMK_STUDIO=n

# Power Management Configuration
## Sleep in 30 seconds
CONFIG_ZMK_IDLE_TIMEOUT=30000
## Enable deep sleep
CONFIG_ZMK_SLEEP=y
## Deep Sleep in 30 minutes
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Display (Keebart sharp_mip shield)
## Keep the display active when the keyboard enters idle
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# RGB underglow (Keebart defaults)
## Off at boot, and turned off when the keyboard enters idle
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
## Change brightness in steps of five percentage points
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=5
## Default brightness, hue and saturation after settings are reset
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=200
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=98
